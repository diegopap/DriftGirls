product:
  type: kmp/lib
  platforms: [ android, iosArm64, iosSimulatorArm64 ]

dependencies:
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose

dependencies@android:
  - $compose.uiTooling
  - $libs.androidx.activity.compose

settings:
  compose:
    enabled: true
    resources:
      packageName: com.driftgirls.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true

settings@iosArm64:
  kotlin:
    freeCompilerArgs:
      - "-linker-option"
      - "-framework"
      - "-linker-option"
      - "AVFoundation"

settings@iosSimulatorArm64:
  kotlin:
    freeCompilerArgs:
      - "-linker-option"
      - "-framework"
      - "-linker-option"
      - "AVFoundation"
